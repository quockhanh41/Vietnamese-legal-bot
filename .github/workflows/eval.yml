name: Eval (retrieval, no LLM cost)

# Tier 1 retrieval eval only (scripts/eval.py, default mode — no LLM calls).
# Tier 2 (--answers) intentionally NOT run here: it burns Groq rate limits /
# money and isn't safe to run unattended on a nightly schedule.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 2 * * *'

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache HuggingFace hub (BGE-M3 ~2GB)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-bge-m3
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: Install dependencies
        run: pip install -e .

      - name: Validate eval sets
        run: python scripts/validate_eval_set.py

      - name: Run Tier 1 retrieval eval (criminal set, no LLM calls)
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: python scripts/eval.py --set criminal

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: data/eval_reports/
          if-no-files-found: warn
