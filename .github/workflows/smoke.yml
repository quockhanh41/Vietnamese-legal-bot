name: Smoke (weekly) + secret scan

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * 1'  # Mondays 03:00 UTC

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  liveness:
    runs-on: ubuntu-latest
    steps:
      - name: Ping public Gradio Space
        run: |
          test -n "${{ secrets.PUBLIC_SPACE_URL }}" || { echo "PUBLIC_SPACE_URL unset"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" -L "${{ secrets.PUBLIC_SPACE_URL }}")
          echo "liveness: $code"; test "$code" = "200"

  functional-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: "${{ runner.os }}-hf-m5" }
      - run: pip install -e .
      - name: Launch API + smoke
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          uvicorn src.api.main:app --host 0.0.0.0 --port 8000 &
          python scripts/smoke_test.py http://localhost:8000
