[project]
name = "vietnamese-legal-bot"
version = "0.1.0"
description = "Adaptive RAG chatbot tra cứu văn bản pháp luật Việt Nam"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "qdrant-client>=1.11.0",
    "FlagEmbedding>=1.2.0",
    "litellm>=1.50.0",
    "streamlit>=1.35.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "datasets>=2.20.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "pydantic>=2.0.0",
    "transformers>=4.44.2,<5.0.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.0",
    "click>=8.0.0",
    "networkx>=3.0",
    "langfuse>=3.0.0,<4.0.0",
]

[project.optional-dependencies]
eval = [
    "ragas>=0.2.0",
    "deepeval>=0.24.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
